# ── JobForge — Docker Compose ───────────────────────────────────────────────
#
# Services:
#   frontend  Next.js 15 web UI (port 3000)
#   backend   FastAPI app (port 8000, hot-reload)
#   postgres  PostgreSQL 16 database
#   redis     Redis 7 (Celery broker)
#   worker    Celery worker (background tasks)
#   beat      Celery beat (scheduled search every 12h)
#
# Ollama runs on your HOST machine (not in Docker)
# so it keeps Metal GPU acceleration on M1 Mac.
# The backend reaches it via host.docker.internal:11434
#
# Usage:
#   docker compose up --build          # first run
#   docker compose up                  # subsequent runs
#   docker compose down                # stop all
#   docker compose down -v             # stop + delete DB data

services:

  # ── Next.js Frontend ─────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_WS_URL: ws://localhost:8000
    container_name: jobforge_frontend
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
    depends_on:
      - backend
    restart: unless-stopped

  # ── FastAPI Backend ──────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jobforge_backend
    ports:
      - "8000:8000"
    volumes:
      # Hot-reload: mount source so changes apply without rebuilding
      - ./backend:/app
      # Persist generated PDFs outside container
      - ./documents:/app/documents
    env_file:
      - ./backend/.env
    environment:
      # Override DB + Redis to use Docker service names
      DATABASE_URL: postgresql+asyncpg://jobforge:jobforge@postgres:5432/jobforge
      REDIS_URL: redis://redis:6379/0
      # Ollama on HOST — reached via special Docker DNS
      LLM_BASE_URL: http://host.docker.internal:11434/v1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    # Needed on Linux so host.docker.internal resolves (Mac Docker Desktop handles it automatically)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # ── PostgreSQL ───────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: jobforge_postgres
    environment:
      POSTGRES_DB: jobforge
      POSTGRES_USER: jobforge
      POSTGRES_PASSWORD: jobforge
    ports:
      - "5432:5432"          # exposed so you can connect with a DB GUI
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobforge"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Celery Worker (background + scheduled tasks) ─────────────────────────
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jobforge_worker
    command: celery -A workers.celery_app worker --loglevel=info
    volumes:
      - ./backend:/app
      - ./documents:/app/documents
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://jobforge:jobforge@postgres:5432/jobforge
      REDIS_URL: redis://redis:6379/0
      LLM_BASE_URL: http://host.docker.internal:11434/v1
    depends_on:
      - postgres
      - redis
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # ── Celery Beat (scheduler — triggers search every 12h) ──────────────────
  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jobforge_beat
    command: celery -A workers.celery_app beat --loglevel=info
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis
    restart: unless-stopped

  # ── Redis ────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: jobforge_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  postgres_data:
    name: jobforge_postgres_data
